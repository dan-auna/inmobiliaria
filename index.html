<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><meta name="claude:viewport-fit-sides" content="cover">
<title>Nuvia Inmobiliaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif&display=swap">
<style>
/* Layout: sidebar oscuro fijo + área de trabajo clara. Tokens: tinta azul, verde petróleo, oro. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#f6f8fb; --line:#e2e8f0; --line-2:#cfd8e3;
  --fg:#0e1a2b; --fg-2:#56677f; --fg-3:#8593a8;
  --accent:#0a7570; --accent-2:#0e8f89; --accent-soft:#dff2f0; --on-accent:#ffffff;
  --gold:#b98a2c; --good:#17885a; --warn:#c07a0c; --bad:#c4433c; --info:#2f6bc4;
  --side:#0b1625; --side-2:#13233a; --side-fg:#b9c6d9; --side-fg-hi:#ffffff;
  --tip:#0e1a2b; --tip-fg:#f4f7fb; --shadow:0 1px 2px rgba(14,26,43,.05),0 8px 24px -12px rgba(14,26,43,.12);
  --s-disp:#0a7570; --s-res:#c89a35; --s-sold:#3f5778; --s-block:#a3afc0;
  --ser0:#0a7570; --ser1:#c89a35; --ser2:#3f5778; --ser3:#b5483f; --ser4:#6b9e8f; --ser5:#8a5a83; --ser6:#7d8da3; --ser7:#a8742a;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111d; --surface:#0f1b2c; --surface-2:#142238; --line:#1f3049; --line-2:#2b4062;
  --fg:#e8eef7; --fg-2:#9aaec8; --fg-3:#6b7f9b;
  --accent:#34c0b8; --accent-2:#5fd3cc; --accent-soft:#0f3a3b; --on-accent:#06201f;
  --gold:#e2b552; --good:#3ccf90; --warn:#e5a23a; --bad:#f06c64; --info:#6aa0f0;
  --side:#060d17; --side-2:#0f1b2c; --side-fg:#9fb1ca; --side-fg-hi:#ffffff;
  --tip:#e8eef7; --tip-fg:#0e1a2b; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --s-disp:#34c0b8; --s-res:#e2b552; --s-sold:#6f8bb3; --s-block:#4a5c78; --ser0:#34c0b8; --ser1:#e2b552; --ser2:#6f8bb3; --ser3:#f06c64; --ser4:#7fd0b8; --ser5:#c08ad0; --ser6:#9fb1ca; --ser7:#d9a35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111d; --surface:#0f1b2c; --surface-2:#142238; --line:#1f3049; --line-2:#2b4062;
  --fg:#e8eef7; --fg-2:#9aaec8; --fg-3:#6b7f9b;
  --accent:#34c0b8; --accent-2:#5fd3cc; --accent-soft:#0f3a3b; --on-accent:#06201f;
  --gold:#e2b552; --good:#3ccf90; --warn:#e5a23a; --bad:#f06c64; --info:#6aa0f0;
  --side:#060d17; --side-2:#0f1b2c; --side-fg:#9fb1ca; --side-fg-hi:#ffffff;
  --tip:#e8eef7; --tip-fg:#0e1a2b; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --s-disp:#34c0b8; --s-res:#e2b552; --s-sold:#6f8bb3; --s-block:#4a5c78; --ser0:#34c0b8; --ser1:#e2b552; --ser2:#6f8bb3; --ser3:#f06c64; --ser4:#7fd0b8; --ser5:#c08ad0; --ser6:#9fb1ca; --ser7:#d9a35a; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--side);color:var(--side-fg);padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--accent-2),var(--accent));display:grid;place-items:center;flex:none}
.brand b{display:block;color:var(--side-fg-hi);font-size:16px;letter-spacing:.01em;line-height:1.1}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-fg);opacity:.75}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:14px 10px 6px;opacity:.55}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:var(--side-fg);text-decoration:none;font-weight:600;font-size:13.5px;position:relative}
.nav a:hover{background:var(--side-2);color:var(--side-fg-hi)}
.nav a[aria-current="page"]{background:var(--side-2);color:var(--side-fg-hi);box-shadow:inset 3px 0 0 var(--accent-2)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:var(--gold);color:#1b1405;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--side-2)}
.me b{display:block;color:var(--side-fg-hi);font-size:13px}
.me span{font-size:11.5px;opacity:.75}
.demo{font-size:11px;opacity:.55;padding:0 8px}

.main{min-width:0;padding-block:26px 56px;padding-left:max(clamp(16px,2.6vw,36px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.6vw,36px),env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);font-weight:600;display:flex;align-items:center;gap:8px}
.live{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
h1.title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,42px);line-height:1.05;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.head-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.iconbtn{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg-2)}
.iconbtn:hover{border-color:var(--line-2);color:var(--fg)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.sm button{padding:4px 10px;font-size:12px}

.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tb .grow{flex:1 1 auto}
.field{position:relative;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:0 12px;height:38px;min-width:0}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.field>span{color:var(--fg-3);font-size:12px;white-space:nowrap}
.field select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:600;font-size:13px;height:100%;padding-right:18px;outline:none;min-width:0;max-width:200px;text-overflow:ellipsis;cursor:pointer}
.field select option{background:var(--surface);color:var(--fg)}
.field.sl::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--fg-3);border-bottom:1.6px solid var(--fg-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.field input[type=search],.field input[type=text]{border:0;background:transparent;outline:none;height:100%;min-width:150px;width:100%;font-size:13px}
.field.search{flex:1 1 220px;max-width:340px}
.field svg{width:16px;height:16px;stroke:var(--fg-3);fill:none;stroke-width:1.8;flex:none}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1280px){.c3{grid-column:span 4}.c4{grid-column:span 6}.c5{grid-column:span 6}.c7{grid-column:span 12}.c8{grid-column:span 12}}
@media(max-width:820px){.c3,.c4,.c5,.c6{grid-column:span 12}}
@media(max-width:1280px) and (min-width:821px){.kpis .c3{grid-column:span 4}}
@media(max-width:1560px){.kpis .c2{grid-column:span 4}}
@media(max-width:820px){.kpis .c2{grid-column:span 6}}
@media(max-width:480px){.kpis .c2{grid-column:span 12}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.005em}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--fg-3)}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:700}

.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--fg-3);margin-left:3px}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kpi svg.spark{width:72px;height:30px;flex:none}
.kpi .sub{font-size:12px;color:var(--fg-3)}
.kpi.hero{background:linear-gradient(160deg,var(--side) 0%,#10304a 100%);border-color:transparent;color:#eaf1fa}
.kpi.hero .lbl,.kpi.hero .sub{color:#9fb6d2}
.kpi.hero .v small{color:#9fb6d2}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.delta.dn{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.kpi.hero .delta.up{color:#6fe3b0;background:rgba(111,227,176,.14)}
.kpi.hero .delta.dn{color:#ff9d96;background:rgba(255,157,150,.14)}

.pill{--c:var(--fg-2);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.p-disp{--c:var(--s-disp)}.p-res{--c:var(--warn)}.p-sold{--c:var(--s-sold)}.p-block{--c:var(--fg-3)}
.t-hot{--c:var(--bad)}.t-warm{--c:var(--warn)}.t-cold{--c:var(--info)}
.p-good{--c:var(--good)}.p-bad{--c:var(--bad)}.p-gold{--c:var(--gold)}.p-acc{--c:var(--accent)}

.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;flex:none;letter-spacing:.02em}
.av.lg{width:52px;height:52px;font-size:17px}.av.sm{width:24px;height:24px;font-size:10px}

.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th.r,td.r{text-align:right}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--fg)}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:9px}
.who b{display:block;font-weight:600;line-height:1.2}
.who small{color:var(--fg-3);font-size:12px}
.muted{color:var(--fg-3)}

.hb{display:flex;flex-direction:column;gap:11px}
.hb-r{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;align-items:center;gap:12px;font-size:12.5px}
.hb-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2);font-weight:600}
.hb-t{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hb-t i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hb-r .vv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fun{display:flex;flex-direction:column;gap:7px}
.fun-r{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center;font-size:12.5px}
.fun-r .n{color:var(--fg-2);font-weight:600}
.fun-b{height:34px;border-radius:8px;background:var(--surface-2);position:relative;overflow:hidden}
.fun-b i{position:absolute;inset:0 auto 0 0;border-radius:8px;border-left:4px solid var(--accent)}
.fun-b span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.fun-b span em{font-style:normal;font-weight:600;font-size:11.5px;color:var(--fg-2)}
@media(max-width:520px){.fun-r{grid-template-columns:92px minmax(0,1fr)}}

.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--fg-3);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent);transition:opacity .15s}
.chart .bar.dim{fill:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.chart .hit:hover+.bar,.chart .barg:hover .bar{opacity:.78}
.chart .goal{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:5 4}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.donut-w{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut-w svg{flex:none}
.dl{display:flex;flex-direction:column;gap:7px;flex:1 1 170px;min-width:0}
.dl div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.dl i{width:10px;height:10px;border-radius:3px}
.dl b{font-variant-numeric:tabular-nums}

.alerts{display:flex;flex-direction:column;gap:10px}
.al{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left;width:100%}
.al:hover{border-color:var(--line-2)}
.al .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.al .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.al b{display:block;font-size:13px}.al small{color:var(--fg-3);font-size:12px}
.al .k{margin-left:auto;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.pc{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s;text-align:left}
.pc:hover{transform:translateY(-2px);border-color:var(--line-2)}
.pc-top{height:116px;position:relative;background:linear-gradient(180deg,var(--hue-a),var(--hue-b));overflow:hidden}
.pc-top svg{position:absolute;inset:auto 0 0 0;width:100%;height:84px}
.pc-top .pill{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.88);color:#10243a}
.pc-top .pill i{background:#10243a}
.pc-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.pc-b h4{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.pc-b .loc{color:var(--fg-3);font-size:12.5px}
.stk{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.stk i{display:block;height:100%}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stats3 small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.stats3 b{font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--fg-3)}
.prog>div:first-child{display:flex;justify-content:space-between}
.prog .hb-t{height:6px}

.plan{display:flex;flex-direction:column;gap:4px}
.plan-r{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center}
.plan-r small{color:var(--fg-3);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.plan-c{display:grid;gap:4px}
.cell{height:32px;border-radius:7px;border:0;font-size:11px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;padding:0}
.cell.disp{background:var(--s-disp)}.cell.res{background:var(--s-res);color:#2a1d03}.cell.sold{background:var(--s-sold)}.cell.block{background:var(--s-block)}
.cell:hover{filter:brightness(1.12);transform:scale(1.04)}

.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--fg-3);flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--line-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.4;cursor:default}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:150px;flex:1 1 150px}
.chip b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip small{color:var(--fg-3);font-size:12px}

.lead-t{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.task{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.task:hover{border-color:var(--line-2)}
.task .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c,var(--accent));flex:none}
.task b{display:block;font-size:12.5px}.task small{color:var(--fg-3);font-size:11.5px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start}

  tb(){ return `<div class="tb">${sel('period','Período',O_PER)}${sel('city','Ciudad',O_CITY)}${sel('project','Proyecto',O_PROJ)}${sel('advisor','Asesor',O_ADV)}<span class="grow"></span><span class="muted" style="font-size:12.5px">Comparado con el período anterior equivalente</span></div>`; },
  body(){
    const P=getPeriod(), C=agg(P.start,P.end), Pv=agg(P.prevStart,P.prevEnd);
    this.P=P; this.series=P.buckets.map(b=>agg(b.s,b.e)); this.C=C;
    const gu = goalMonthly()*P.months, cum = gu? C.n/gu : 0;
    const rv = this.series.map(x=>x.rev), un = this.series.map(x=>x.n), ld = this.series.map(x=>x.lead);
    const cv = this.series.map(x=>x.conv);
    const kpi = (cls,lbl,val,d,sub,sp,inv)=>`<div class="card kpi c2 ${cls}"><span class="lbl">${lbl}</span><div class="v">${val}</div><div class="row"><div style="display:flex;flex-direction:column;gap:3px;min-width:0">${d}<span class="sub">${sub}</span></div>${sp||''}</div></div>`;
    const dpp = Pv.conv? (C.conv-Pv.conv)*100 : null;
    const kpis = `<div class="grid kpis" style="margin-bottom:16px">
      ${kpi('hero','Ventas cerradas',mc(C.rev),deltaPill(delta(C.rev,Pv.rev)),'vs '+mc(Pv.rev),sparkline(rv,'#6fe3b0'))}
      ${kpi('','Unidades vendidas',nf(C.n),deltaPill(delta(C.n,Pv.n)),'vs '+Pv.n+' anteriores',sparkline(un,'var(--accent)'))}
      ${kpi('','Ticket promedio',C.n?mc(C.tk):'—',deltaPill(delta(C.tk,Pv.tk)),Pv.n?'vs '+mc(Pv.tk):'',sparkline(this.series.map(x=>x.tk),'var(--gold)'))}
      ${kpi('','Leads generados',nf(C.lead),deltaPill(delta(C.lead,Pv.lead)),nf(C.visits)+' llegaron a visita',sparkline(ld,'var(--info)'))}
      ${kpi('','Conversión a venta',pct(C.conv),dpp===null?'':`<span class="delta ${dpp>=0?'up':'dn'}">${dpp>=0?'▲':'▼'} ${Math.abs(dpp).toFixed(1)} pp</span>`,'lead → cierre',sparkline(cv,'var(--accent)'))}
      <div class="card kpi c2"><span class="lbl">Cumplimiento de meta</span><div class="v" style="color:${cum>=1?'var(--good)':cum>=.8?'var(--warn)':'var(--bad)'}">${pct(cum,0)}</div><div class="hb-t" style="height:8px"><i style="width:${Math.min(100,cum*100)}%;background:${cum>=1?'var(--good)':cum>=.8?'var(--warn)':'var(--bad)'}"></i></div><span class="sub">${C.n} de ${Math.round(gu)} unidades meta</span></div>
    </div>`;
    // Embudo
    const L=C.l, fn=[['Leads',L.length],['Contactados',L.filter(x=>x.reached>=1).length],['Visita agendada',L.filter(x=>x.reached>=2).length],['Visitaron',L.filter(x=>x.reached>=3).length],['Separación',L.filter(x=>x.reached>=4).length],['Cierre',L.filter(x=>x.reached>=5).length]];
    const funnel = '<div class="fun">'+fn.map((r,i)=>{const w=fn[0][1]?Math.max(7,r[1]/fn[0][1]*100):0, prev=i?fn[i-1][1]:0;
      return `<div class="fun-r"><span class="n">${r[0]}</span><div class="fun-b"><i style="width:${w}%;background:color-mix(in srgb,var(--accent) ${46-i*5}%,var(--surface))"></i><span>${nf(r[1])}<em>${i?pct(prev?r[1]/prev:0,0)+' del paso previo':'100%'}</em></span></div></div>`;}).join('')+'</div>';
    // Ventas por proyecto
    const byP = PROJ.map(p=>({p,s:C.s.filter(u=>u.project===p.id)})).filter(x=>x.s.length).sort((a,b)=>sum(b.s,'sold')-sum(a.s,'sold'));
    const projBars = byP.length ? hbars(byP.map(x=>({n:x.p.name,v:sum(x.s,'sold'),t:`${mc(sum(x.s,'sold'))} <span class="muted">· ${x.s.length} uds</span>`,open:'proj:'+x.p.id,c:serColor(PROJ.indexOf(x.p))}))) : '<div class="empty">Sin ventas en este período con los filtros actuales.</div>';
    // Canales
    const ch = SRC.map(s=>{const ls=L.filter(l=>l.src===s.id), vs=ls.filter(l=>l.stage===5).length; return {s,ls:ls.length,vs,conv:ls.length?vs/ls.length:0,cost:ls.length*s.cpl}}).sort((a,b)=>b.conv-a.conv);
    const bestConv = Math.max(...ch.map(c=>c.conv));
    const chTable = `<div class="tw"><table><thead><tr><th>Canal</th><th class="r">Leads</th><th class="r">Ventas</th><th>Conversión</th><th class="r">Costo / lead</th><th class="r">Costo / venta</th></tr></thead><tbody>${ch.map(c=>`<tr style="cursor:default"><td><b style="font-weight:600">${esc(c.s.id)}</b></td><td class="r">${nf(c.ls)}</td><td class="r">${c.vs}</td><td><div style="display:flex;align-items:center;gap:8px"><span class="hb-t" style="width:70px;height:7px"><i style="width:${bestConv?c.conv/bestConv*100:0}%"></i></span><b>${pct(c.conv)}</b></div></td><td class="r">${c.s.cpl?mf(c.s.cpl):'—'}</td><td class="r">${c.vs&&c.cost?mf(c.cost/c.vs):'—'}</td></tr>`).join('')}</tbody></table></div>`;
    // Financiamiento
    const finItems = FIN.map((f,i)=>({n:f,v:C.s.filter(u=>u.fin===f).length,c:serColor(i)})).filter(x=>x.v);
    const finBlock = finItems.length ? `<div class="donut-w">${donut(finItems,{center:C.n,sub:'ventas'})}<div class="dl">${finItems.map(x=>`<div><i style="background:${x.c}"></i><span>${x.n}</span><b>${pct(x.v/C.n,0)}</b></div>`).join('')}</div></div><div class="stats3" style="margin-top:18px"><div><small>Mejor canal</small><b style="font-size:13px">${esc(ch[0].s.id.split(' (')[0])}</b></div><div><small>Conv. top</small><b>${pct(ch[0].conv)}</b></div><div><small>Con crédito</small><b>${pct(C.n?C.s.filter(u=>u.fin.startsWith('Crédito')).length/C.n:0,0)}</b></div></div>` : '<div class="empty">Sin datos</div>';
    // Stock
    const us = UNITS.filter(u=>(S.city==='all'||u.city===S.city)&&(S.project==='all'||u.project===S.project));
    const cnt = st=>us.filter(u=>u.status===st).length;
    const sold90 = SOLD.filter(u=>u.saleTs>=ago(90)&&(S.city==='all'||u.city===S.city)&&(S.project==='all'||u.project===S.project)).length;
    const absor = sold90/3, disp = cnt('Disponible'), mesesStock = absor? disp/absor : 0;
    const stockItems = [{n:'Disponible',v:disp,c:'var(--s-disp)'},{n:'Reservado',v:cnt('Reservado'),c:'var(--s-res)'},{n:'Vendido',v:cnt('Vendido'),c:'var(--s-sold)'},{n:'Bloqueado',v:cnt('Bloqueado'),c:'var(--s-block)'}];
    const stock = `<div class="donut-w">${donut(stockItems,{center:pct(us.length?cnt('Vendido')/us.length:0,0),sub:'vendido',fs:25})}<div class="dl">${stockItems.map(x=>`<div><i style="background:${x.c}"></i><span>${x.n}</span><b>${x.v}</b></div>`).join('')}</div></div>
      <div class="stats3" style="margin-top:16px"><div><small>Absorción</small><b>${absor.toFixed(1)}/mes</b></div><div><small>Stock</small><b>${mesesStock?mesesStock.toFixed(1)+' m':'—'}</b></div><div><small>Disponible</small><b>${mc(sum(us.filter(u=>u.status==='Disponible'),'price'))}</b></div></div>`;
    // Ranking
    const rk = ADV.map(a=>{const s=C.s.filter(u=>u.adv===a.id); const g=a.goal*P.months; return {a,rev:sum(s,'sold'),n:s.length,cum:g?s.length/g:0}}).filter(x=>x.n||S.advisor===x.a.id).sort((a,b)=>b.rev-a.rev).slice(0,5);
    const ranking = rk.length? `<div class="rank">${rk.map((r,i)=>`<div class="rank-r" style="cursor:pointer" data-open="adv:${r.a.id}"><b>${i+1}</b>${av(r.a)}<div style="min-width:0"><b style="font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.a.name)}</b><div class="hb-t"><i style="width:${Math.min(100,r.cum*100)}%;background:${r.cum>=1?'var(--good)':'var(--accent)'}"></i></div><span class="muted" style="font-size:11.5px">${r.n} uds · ${pct(r.cum,0)} de la meta</span></div><b class="num">${mc(r.rev)}</b></div>`).join('')}</div>` : '<div class="empty">Sin ventas</div>';
    // Precio m² por distrito
    const dists = [...new Set(PROJ.filter(p=>(S.city==='all'||p.city===S.city)&&(S.project==='all'||p.id===S.project)).map(p=>p.district))];
    const dRows = dists.map(d=>{const ps=PROJ.filter(p=>p.district===d), ss=SOLD.filter(u=>u.district===d&&u.saleTs>=ago(180)); const set=ss.length?ss:ps.flatMap(p=>p.units); const v=sum(set,x=>(x.sold||x.price))/sum(set,'area'); return {d,v,m:MKT[d]||v,n:ss.length}}).sort((a,b)=>b.v-a.v);
    const mTable = `<div class="tw"><table><thead><tr><th>Distrito</th><th class="r">${sym()}/m²</th><th class="r">vs. mercado</th></tr></thead><tbody>${dRows.map(r=>{const df=r.v/r.m-1; return `<tr style="cursor:default"><td>${esc(r.d)}</td><td class="r"><b>${nf(fx(r.v))}</b></td><td class="r"><span data-tip="${esc(r.d+'|Mercado: '+sym()+' '+nf(fx(r.m))+'/m²')}" class="delta ${df>=0?'up':'dn'}">${df>=0?'+':''}${(df*100).toFixed(1)}%</span></td></tr>`}).join('')}</tbody></table></div>`;
    const al = alertsData();
    const alerts = `<div class="alerts">${al.map(a=>`<button class="al" style="--c:${a.c}" data-go="${a.go}"><span class="ic"><svg viewBox="0 0 24 24">${IC[a.ic]}</svg></span><span><b>${a.t}</b><small>${a.s}</small></span><span class="k">${a.k}</span></button>`).join('')}</div>`;
    return kpis + `<div class="grid">
      <div class="card c8"><div class="card-h"><div><h3>Evolución de ventas</h3><p>${P.label} · línea punteada: meta</p></div>${seg('metric',[['monto','Monto'],['unidades','Unidades'],['leads','Leads']],'sm')}</div><div class="chart" id="mainchart" style="min-height:268px"></div></div>
      <div class="card c4"><div class="card-h"><div><h3>Requiere atención</h3><p>Acciones pendientes del equipo comercial</p></div></div>${alerts}</div>
      <div class="card c5"><div class="card-h"><div><h3>Embudo comercial</h3><p>Leads creados en el período, por etapa alcanzada</p></div></div>${funnel}</div>
      <div class="card c7"><div class="card-h"><div><h3>Ventas por proyecto</h3><p>Monto cerrado y unidades · clic para ver el detalle</p></div></div>${projBars}</div>
      <div class="card c7"><div class="card-h"><div><h3>Rendimiento por canal de captación</h3><p>Ordenado por conversión · costos referenciales</p></div></div>${chTable}</div>
      <div class="card c5"><div class="card-h"><div><h3>Forma de financiamiento</h3><p>Ventas del período</p></div></div>${finBlock}</div>
      <div class="card c4"><div class="card-h"><div><h3>Estado del inventario</h3><p>Absorción de los últimos 90 días</p></div></div>${stock}</div>
      <div class="card c4"><div class="card-h"><div><h3>Top asesores</h3><p>Por monto vendido en el período</p></div></div>${ranking}</div>
      <div class="card c4"><div class="card-h"><div><h3>Precio por m² vs. mercado</h3><p>Ventas de 6 meses · referencia de zona</p></div></div>${mTable}</div>
    </div>`;
  },
  after(){
    const el=$('#mainchart'); if(!el||!this.series) return;
    const P=this.P, ser=this.series, m=S.metric, gm=goalMonthly(), tk=this.C.tk||AVG_TICKET;
    const gU = P.buckets.map(b=>gm*(b.e-b.s)/(30.4*DAY));
    let bars, goal, axis, tip;
    if(m==='monto'){ bars=ser.map(x=>x.rev); goal=gU.map(g=>g*tk); axis=axisM; tip=i=>`${P.buckets[i].label}|Ventas: ${mf(bars[i])}|Unidades: ${ser[i].n}|Meta: ${mc(goal[i])}`; }
    else if(m==='unidades'){ bars=ser.map(x=>x.n); goal=gU; axis=v=>Math.round(v*10)/10; tip=i=>`${P.buckets[i].label}|Unidades: ${bars[i]}|Meta: ${goal[i].toFixed(1)}`; }
    else { bars=ser.map(x=>x.lead); goal=null; axis=v=>nf(v); tip=i=>`${P.buckets[i].label}|Leads: ${nf(bars[i])}|Visitas: ${ser[i].visits}|Ventas: ${ser[i].n}`; }
    el.innerHTML = barChart(el.clientWidth||640,{labels:P.buckets.map(b=>b.label),bars,goal,axis,tip,aria:'Evolución de ventas'});
  }
};

V.proyectos = {
  title:'Proyectos inmobiliarios',
  tb(){ return `<div class="tb">${search('jq','Buscar proyecto o distrito')}${sel('jcity','Ciudad',O_CITY)}${sel('jstage','Etapa',[['all','Todas'],['Preventa','Preventa'],['En construcción','En construcción'],['Entrega inmediata','Entrega inmediata']])}</div>`; },
  body(){
    const q=S.jq.trim().toLowerCase();
    const ps = PROJ.filter(p=>(S.jcity==='all'||p.city===S.jcity)&&(S.jstage==='all'||p.stage===S.jstage)&&(!q||(p.name+' '+p.district+' '+p.city).toLowerCase().includes(q)));
    const us = ps.flatMap(p=>p.units), c = st=>us.filter(u=>u.status===st);
    const chips = `<div class="chips">
      <div class="chip"><small>Proyectos activos</small><b>${ps.length}</b></div>
      <div class="chip"><small>Unidades totales</small><b>${us.length}</b></div>
      <div class="chip"><small>Vendidas</small><b>${c('Vendido').length} <span class="muted" style="font-size:13px;font-weight:600">${pct(us.length?c('Vendido').length/us.length:0,0)}</span></b></div>
      <div class="chip"><small>Reservadas</small><b>${c('Reservado').length}</b></div>
      <div class="chip"><small>Valor del stock disponible</small><b>${mc(sum(c('Disponible'),'price'))}</b></div>
    </div>`;
    if(!ps.length) return chips+'<div class="card empty">No hay proyectos con estos filtros.</div>';
    return chips+'<div class="pgrid">'+ps.map(p=>{
      const i=PROJ.indexOf(p), n=p.units.length, st=k=>p.units.filter(u=>u.status===k).length;
      const s30 = SOLD.filter(u=>u.project===p.id&&u.saleTs>=ago(30)).length;
      const minP = Math.min(...p.units.filter(u=>u.status==='Disponible').map(u=>u.price), Infinity);
      const stClass = p.stage==='Entrega inmediata'?'p-good':p.stage==='Preventa'?'p-gold':'p-acc';
      return `<button class="card pc" data-open="proj:${p.id}" style="--hue-a:${p.hue[0]};--hue-b:${p.hue[1]}">
        <div class="pc-top"><span class="pill"><i></i>${p.stage}</span>${skyline(i+1,'#16365a')}</div>
        <div class="pc-b"><div><h4>${esc(p.name)}</h4><div class="loc">${esc(p.district)}, ${esc(p.city)} · entrega ${p.delivery}</div></div>
        <div><div class="stk" data-tip="${esc('Inventario|Vendido: '+st('Vendido')+'|Reservado: '+st('Reservado')+'|Disponible: '+st('Disponible'))}"><i style="width:${st('Vendido')/n*100}%;background:var(--s-sold)"></i><i style="width:${st('Reservado')/n*100}%;background:var(--s-res)"></i><i style="width:${st('Disponible')/n*100}%;background:var(--s-disp)"></i><i style="flex:1;background:var(--s-block);opacity:.5"></i></div>
        <div class="legend" style="margin-top:8px"><span><i style="background:var(--s-sold)"></i>${st('Vendido')} vendidas</span><span><i style="background:var(--s-res)"></i>${st('Reservado')} reservadas</span><span><i style="background:var(--s-disp)"></i>${st('Disponible')} disp.</span></div></div>
        <div class="stats3"><div><small>Desde</small><b>${isFinite(minP)?mc(minP):'—'}</b></div><div><small>Ventas 30 d</small><b>${s30}</b></div><div><small>${sym()}/m²</small><b>${nf(fx(p.ppm))}</b></div></div>
        <div class="prog"><div><span>Avance de obra</span><b style="color:var(--fg)">${p.progress}%</b></div><div class="hb-t"><i style="width:${p.progress}%"></i></div></div></div>
      </button>`;}).join('')+'</div>';
  }
};

const PRICE_BANDS = {lt150:[0,150e3],b150:[150e3,250e3],b250:[250e3,400e3],gt400:[400e3,1e12]};
const unitPrice = u => u.sold||u.price;
V.propiedades = {
  title:'Gestión de propiedades',
  tb(){ return `<div class="tb">${search('pq','Buscar código, proyecto o distrito')}${sel('pproj','Proyecto',O_PROJ)}${sel('pstatus','Estado',[['all','Todos'],['Disponible','Disponible'],['Reservado','Reservado'],['Vendido','Vendido'],['Bloqueado','Bloqueado']])}${sel('pbed','Dormitorios',[['all','Todos'],['1','1'],['2','2'],['3','3'],['4','4+']])}${sel('pprice','Precio',[['all','Todos'],['lt150','Hasta US$ 150 K'],['b150','US$ 150–250 K'],['b250','US$ 250–400 K'],['gt400','Más de US$ 400 K']])}${sel('padv','Asesor',O_ADV)}<span class="grow"></span>${sel('psort','Orden',[['price-desc','Mayor precio'],['price-asc','Menor precio'],['area-desc','Mayor área'],['code','Código']])}${seg('pview',[['tabla','Tabla'],['cards','Tarjetas']])}</div>`; },
  list(){
    const q=S.pq.trim().toLowerCase();
    let r = UNITS.filter(u=>{ const p=projById[u.project];
      if(S.pproj!=='all'&&u.project!==S.pproj) return false;
      if(S.pstatus!=='all'&&u.status!==S.pstatus) return false;
      if(S.pbed!=='all'&&(S.pbed==='4'?u.bed<4:u.bed!==+S.pbed)) return false;
      if(S.pprice!=='all'){const b=PRICE_BANDS[S.pprice]; if(u.price<b[0]||u.price>=b[1]) return false;}
      if(S.padv!=='all'&&u.adv!==S.padv) return false;
      if(q&&!(u.id+' '+p.name+' '+p.district+' '+u.type).toLowerCase().includes(q)) return false;
      return true; });
    const so=S.psort; r.sort((a,b)=> so==='price-desc'?unitPrice(b)-unitPrice(a): so==='price-asc'?unitPrice(a)-unitPrice(b): so==='area-desc'?b.area-a.area : a.id.localeCompare(b.id));
    return r;
  },
  body(){
    const r=this.list(), c=st=>r.filter(u=>u.status===st);
    const per = S.pview==='cards'?12:12, pages=Math.max(1,Math.ceil(r.length/per)); if(S.ppage>pages) S.ppage=pages;
    const slice = r.slice((S.ppage-1)*per, S.ppage*per);
    const chips = `<div class="chips"><div class="chip"><small>Resultados</small><b>${nf(r.length)}</b></div><div class="chip"><small>Disponibles</small><b style="color:var(--s-disp)">${c('Disponible').length}</b></div><div class="chip"><small>Reservadas</small><b style="color:var(--warn)">${c('Reservado').length}</b></div><div class="chip"><small>Vendidas</small><b>${c('Vendido').length}</b></div><div class="chip"><small>Valor disponible</small><b>${mc(sum(c('Disponible'),'price'))}</b></div></div>`;
    if(!r.length) return chips+'<div class="card empty">No hay propiedades con estos filtros. Prueba ampliar el rango de precio o el estado.</div>';
    let main;
    if(S.pview==='cards'){
      main = '<div class="pgrid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">'+slice.map(u=>{const p=projById[u.project], a=u.adv?advById[u.adv]:null;
        return `<button class="card pc" data-open="unit:${u.id}" style="--hue-a:${p.hue[0]};--hue-b:${p.hue[1]}"><div class="pc-top" style="height:78px">${skyline(PROJ.indexOf(p)+4,'#16365a')}<span class="pill" style="left:12px;top:12px">${u.id}</span></div>
        <div class="pc-b" style="gap:10px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b style="font-size:15px">${u.type} ${u.bed} dorm.</b><div class="loc" style="color:var(--fg-3);font-size:12.5px">${esc(p.name)} · piso ${u.floor}</div></div>${statusPill(u.status)}</div>
        <div class="big" style="font-size:22px">${mc(unitPrice(u))}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;color:var(--fg-3);font-size:12.5px"><span>${u.area} m² · ${nf(fx(unitPrice(u)/u.area))} ${sym()}/m²</span>${a?av(a,'sm'):''}</div></div></button>`;}).join('')+'</div>';
    } else {
      main = `<div class="card" style="padding:8px 12px 12px"><div class="tw"><table><thead><tr><th>Código</th><th>Proyecto</th><th>Tipo</th><th class="r">Piso</th><th class="r">Área</th><th class="r">Dorm.</th><th class="r">Precio</th><th class="r">${sym()}/m²</th><th>Estado</th><th>Asesor</th></tr></thead><tbody>${slice.map(u=>{const p=projById[u.project],a=u.adv?advById[u.adv]:null;
        return `<tr data-open="unit:${u.id}"><td><b>${u.id}</b></td><td><div class="who"><div><b>${esc(p.name)}</b><small>${esc(p.district)}</small></div></div></td><td>${u.type}</td><td class="r">${u.floor}</td><td class="r">${u.area} m²</td><td class="r">${u.bed}</td><td class="r"><b>${mf(unitPrice(u))}</b></td><td class="r muted">${nf(fx(unitPrice(u)/u.area))}</td><td>${statusPill(u.status)}</td><td>${a?`<div class="who">${av(a,'sm')}<span>${esc(a.name.split(' ')[0])}</span></div>`:'<span class="muted">Sin asignar</span>'}</td></tr>`;}).join('')}</tbody></table></div></div>`;
    }

function advStats(a,P){

  const pipe = LEADS.filter(x=>x.advisor===a.id&&x.stage>=0&&x.stage<=4&&(S.city==='all'||x.city===S.city));

}

    <div class="sec"><h5>Ventas mensuales · últimos 12 meses</h5><div class="chart">${chart}</div></div>
    <div class="sec"><h5>Cartera abierta por etapa</h5>${hbars(pipe)}</div>
    <div class="sec"><h5>Clientes más avanzados</h5><div style="display:flex;flex-direction:column;gap:8px">${hot.map(l=>`<button class="task" data-open="lead:${l.id}" style="--c:${STAGES[l.stage].color}"><span class="dot"></span><span style="flex:1"><b>${esc(l.name)}</b><small>${STAGES[l.stage].name} · ${esc(projById[l.project].name)}</small></span><b class="num">${mc(l.value)}</b></button>`).join('')||'<span class="muted">Sin cartera abierta</span>'}</div></div>`
  };
}

function buildEvents(l){
  if(l.events) return l.events;
  const r=mulberry(+l.id.slice(2)), p=projById[l.project], ev=[], span=Math.max(DAY,(l.lastTs||l.createdTs)-l.createdTs), at=f=>l.createdTs+span*f;
  ev.push({ts:l.createdTs,t:'lead',x:`Ingresó por ${l.src} consultando por ${p.name}`});
  if(l.reached>=1){ ev.push({ts:l.createdTs+(l.resp||15)*6e4,t:'call',x:`Primer contacto a los ${l.resp||15} min · busca ${l.bed} dormitorio${l.bed>1?'s':''}`}); ev.push({ts:at(.2),t:'wa',x:'Se envió brochure y lista de precios por WhatsApp'}); }
  if(l.reached>=2) ev.push({ts:at(.45),t:'visit',x:`Visita agendada a la sala de ventas de ${p.name}`});
  if(l.reached>=3) ev.push({ts:at(.65),t:'visit',x:'Visitó el departamento piloto · solicitó cotización'});
  if(l.reached>=4 && l.stage>=4){ const u=l.unit?unitById[l.unit]:null; ev.push({ts:u&&u.resTs?u.resTs:l.stageTs,t:'sale',x:`Separación de ${l.unit||'unidad'} · constancia de pago registrada`}); }
  if(l.stage===5) ev.push({ts:l.stageTs,t:'sale',x:`Cierre ganado${l.unit?' · '+l.unit:''} · minuta firmada`});
  if(l.stage===-1) ev.push({ts:l.stageTs,t:'lost',x:'Descartado: '+(l.why||'sin respuesta')});
  l.events=ev; return ev;
}
function drLead(id){
  const l=LEADS.find(x=>x.id===id), p=projById[l.project], a=advById[l.advisor];
  const evs=[...buildEvents(l),...(l.extra||[])].sort((x,y)=>y.ts-x.ts);
  const cur=l.stage;
  const step=STAGES.map(s=>`<button data-st="${s.id}" class="${cur===s.id?'cur':cur>s.id?'done':''}">${s.name}</button>`).join('');
  const u=l.unit?unitById[l.unit]:null;
  const circ=a.color;
  return {
    head:`<div style="display:flex;gap:14px;align-items:center;min-width:0"><span class="av lg" style="background:${circ}">${l.name.split(' ').slice(0,2).map(x=>x[0]).join('')}</span><div style="min-width:0"><h2>${esc(l.name)}</h2><div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">${tempPill(l.temp)}${l.stage<0?'<span class="pill p-bad"><i></i>Descartado</span>':`<span class="pill" style="--c:${STAGES[l.stage].color}"><i></i>${STAGES[l.stage].name}</span>`}<span class="muted" style="font-size:12px">${l.id}</span></div></div></div>`,
    body:`<div class="acts"><button class="btn pri" data-log="call">${ico('phone')}Llamar</button><button class="btn" data-log="wa">${ico('chat')}WhatsApp</button><button class="btn" data-log="mail">${ico('mail')}Correo</button><button class="btn" data-log="visit">${ico('cal')}Agendar visita</button></div>
    <div class="sec"><h5>Etapa del proceso</h5><div class="stepper">${step}</div></div>
    ${l.next&&l.stage>=0&&l.stage<5?`<div class="nx lc" style="cursor:default;flex-direction:row;align-items:center;gap:10px;${isLate(l)?'border-color:var(--bad)':''}"><span style="color:${isLate(l)?'var(--bad)':'var(--accent)'};display:grid">${ico('cal')}</span><div style="flex:1"><b>${esc(l.next.text)}</b><div class="muted" style="font-size:12px">${dueLabel(l.next.due)}</div></div></div>`:''}
    <div class="sec"><h5>Contacto</h5>${kv([['Teléfono',esc(l.phone)],['Correo',esc(l.email)],['Ocupación',esc(l.job)],['Vive en',esc(l.from)]])}</div>
    <div class="sec"><h5>Interés y perfil de compra</h5>${kv([['Proyecto',esc(p.name)+' · '+esc(p.district)],['Tipología',l.bed+' dormitorio'+(l.bed>1?'s':'')],['Presupuesto',mf(l.budget)],['Valor del negocio',mf(l.value)],['Financiamiento',esc(l.fin)],['Motivo',esc(l.motivo)],['Canal de origen',esc(l.src)],['Unidad',u?`<a href="#" data-open="unit:${u.id}" style="color:var(--accent);font-weight:700">${u.id}</a>`:'Por definir']])}</div>
    <div class="sec"><h5>Probabilidad de cierre</h5><div class="score"><div class="hb-t"><i style="width:${l.score}%;background:${l.score>=70?'var(--good)':l.score>=40?'var(--warn)':'var(--info)'}"></i></div><b class="num">${l.score}/100</b></div></div>
    <div class="sec"><h5>Asesor responsable</h5><label class="field sl" style="align-self:flex-start;display:inline-flex"><span>Asesor</span><select data-assign="lead" aria-label="Asesor responsable">${ADV.filter(x=>x.cities.includes(p.city)).map(x=>`<option value="${x.id}"${l.advisor===x.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>
    <div class="sec"><h5>Nueva nota</h5><textarea class="note" id="note-t" placeholder="Escribe un acuerdo, objeción o dato del cliente…"></textarea><div class="acts" style="margin-top:8px"><button class="btn" data-note>${ico('note')}Guardar nota</button>${l.stage>=0&&l.stage<5?'<button class="btn" data-discard style="color:var(--bad)">Descartar cliente</button>':''}</div></div>
    <div class="sec"><h5>Historial de actividad</h5><div class="tl">${evs.map(e=>`<div style="--c:${EV_COLOR[e.t]||'var(--accent)'}"><b>${esc(e.x)}</b><small>${fdl(e.ts)}</small></div>`).join('')}</div></div>`
  };
}

function renderDrawer(){
  const dr=$('#drawer'), keep=(dr.querySelector('.dr-b')||{}).scrollTop||0;
  const o={unit:drUnit,proj:drProj,adv:drAdv,lead:drLead}[D.type](D.id);
  dr.innerHTML=`<div class="dr-h">${o.head}<button class="x" data-close aria-label="Cerrar panel">${ico('x')}</button></div><div class="dr-b">${o.body}</div>`;
  dr.querySelector('.dr-b').scrollTop=keep; o.after&&o.after();
}
function openDrawer(t,id){
  const same=D.type===t&&D.id===id; D.type=t; D.id=id; renderDrawer();
  if(!same) $('#drawer .dr-b').scrollTop=0;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false');
}
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); D.type=null; }

/* ================= ACCIONES CRM ================= */
function moveLead(id,st){
  const l=LEADS.find(x=>x.id===id); if(!l||l.stage===st) return;
  const from=l.stage; l.stage=st; l.stageTs=T0; l.lastTs=T0;
  if(st>=0){ l.reached=Math.max(l.reached,st); if(st>=4) l.temp='Caliente'; }
  l.next = st>=0&&st<=4 ? {text:pick(ACT[st]),due:T0+DAY} : null;
  (l.extra=l.extra||[]).push({ts:T0,t:st===5?'sale':st<0?'lost':'stage',x:st<0?'Cliente descartado':`Etapa: ${from>=0?STAGES[from].name:'Descartado'} → ${STAGES[st].name}`});
  if(st<0) l.why='Descartado manualmente';
  toast(st===5?'¡Cierre registrado! '+l.name:st<0?'Cliente descartado':l.name.split(' ')[0]+' pasó a '+STAGES[st].name);
  refresh();
}
function logAct(id,kind){
  const l=LEADS.find(x=>x.id===id), m={call:['call','Llamada registrada · se coordinó el siguiente paso'],wa:['wa','Mensaje de WhatsApp enviado con información del proyecto'],mail:['note','Correo enviado con cotización y cronograma'],visit:['visit','Visita agendada a la sala de ventas']}[kind];
  (l.extra=l.extra||[]).push({ts:T0,t:m[0],x:m[1]}); l.lastTs=T0; if(l.stage===0&&kind!=='mail') { l.stage=1; l.reached=Math.max(1,l.reached); l.stageTs=T0; l.resp=l.resp||12; }
  if(kind==='visit'&&l.stage<2){ l.stage=2; l.reached=Math.max(2,l.reached); l.stageTs=T0; }
  toast('Actividad registrada'); refresh();
}
function refresh(){
  if(S.view==='crm'){ const b=$('#board'), sx=b?b.scrollLeft:0; update(); const nb=$('#board'); if(nb) nb.scrollLeft=sx; } else update();
  if(D.type) renderDrawer(); badge();
}
function badge(){ const n=openLeads().filter(l=>l.next&&l.next.due<=T0+1000).length; $('#crm-badge').textContent=n; }

/* ================= ENRUTADOR Y EVENTOS ================= */
function renderTb(){ $('#tb').innerHTML=V[S.view].tb(); }
function update(){ const v=V[S.view]; $('#body').innerHTML=v.body(); v.after&&v.after(); }
function go(v,keep){
  if(!V[v]) v='resumen'; S.view=v;
  $$('#nav a').forEach(a=>{ if(a.dataset.v===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#title').textContent=V[v].title; renderTb(); update(); if(!keep) window.scrollTo(0,0);
}
function nav(v){ closeDrawer(); try{ history.replaceState(null,'','#'+v); }catch(e){} go(v); }
const RESET_P = ['pq','pproj','pstatus','pbed','pprice','padv','psort'];
function onFilter(k,val){
  S[k]=val; if(RESET_P.includes(k)) S.ppage=1;
  if(k==='project'&&val!=='all') S.city='all';
  if(k==='city'&&val!=='all'&&S.project!=='all'&&projById[S.project].city!==val) S.project='all';
  if(k==='city'||k==='project') renderTb();
  update();
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f&&t.type==='search') onFilter(t.dataset.f,t.value);
  if(t.dataset.sim){ SIM[t.dataset.sim]=+t.value; simCalc(unitPrice(unitById[D.id])); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f&&t.type!=='search') onFilter(t.dataset.f,t.value);
  if(t.dataset.assign==='unit'){ unitById[D.id].adv=t.value||null; toast('Asesor actualizado'); if(S.view==='propiedades') update(); }
  if(t.dataset.assign==='lead'){ const l=LEADS.find(x=>x.id===D.id); l.advisor=t.value; toast('Cliente reasignado a '+advById[t.value].name.split(' ')[0]); refresh(); }
});
document.addEventListener('click',e=>{
  const t=e.target; let el;
  if(t.closest('[data-close]')||t===$('#scrim')) return closeDrawer();
  if(el=t.closest('[data-cur]')){ S.cur=el.dataset.cur; try{localStorage.setItem('nuvia-cur',S.cur)}catch(x){} syncCur(); update(); if(D.type) renderDrawer(); return; }
  if(el=t.closest('[data-seg]')){ const [k,v]=el.dataset.seg.split(':'); S[k]=v; if(k==='metric'){ update(); } else { if(k==='pview') S.ppage=1; renderTb(); update(); } return; }
  if(el=t.closest('[data-sort]')){ const k=el.dataset.sort; if(S.asort===k) S.adir*=-1; else { S.asort=k; S.adir=k==='name'?1:-1; } update(); return; }
  if(el=t.closest('[data-page]')){ S.ppage+=+el.dataset.page; update(); window.scrollTo({top:0}); return; }
  if(el=t.closest('[data-st]')){ if(D.type==='lead') moveLead(D.id,+el.dataset.st); return; }
  if(el=t.closest('[data-log]')){ logAct(D.id,el.dataset.log); return; }
  if(t.closest('[data-note]')){ const v=($('#note-t').value||'').trim(); if(!v){ toast('Escribe una nota antes de guardar'); return; } const l=LEADS.find(x=>x.id===D.id); (l.extra=l.extra||[]).push({ts:T0,t:'note',x:'Nota: '+v}); toast('Nota guardada'); renderDrawer(); return; }
  if(t.closest('[data-discard]')){ moveLead(D.id,-1); return; }
  if(el=t.closest('[data-viewunits]')){ S.pproj=el.dataset.viewunits; S.pstatus='Disponible'; S.ppage=1; nav('propiedades'); return; }
  if(el=t.closest('[data-go]')){ e.preventDefault(); nav(el.dataset.go); return; }
  if(el=t.closest('[data-open]')){ e.preventDefault(); const [ty,id]=el.dataset.open.split(':'); openDrawer(ty,id); return; }
  if(t.closest('#theme')){ const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme=dark?'light':'dark'; try{localStorage.setItem('nuvia-theme',r.dataset.theme)}catch(x){} return; }
  if(el=t.closest('#nav a')){ e.preventDefault(); nav(el.dataset.v); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&D.type) closeDrawer(); });
/* Arrastrar y soltar en el tablero */
let dragId=null;
document.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('.lc'); if(!c) return; dragId=c.dataset.lead; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragId)}catch(x){} setTimeout(()=>c.classList.add('drag'),0); });
document.addEventListener('dragend',()=>{ $$('.lc.drag').forEach(c=>c.classList.remove('drag')); $$('.col.over').forEach(c=>c.classList.remove('over')); dragId=null; });
document.addEventListener('dragover',e=>{ const col=e.target.closest&&e.target.closest('.col'); if(col&&dragId){ e.preventDefault(); $$('.col.over').forEach(c=>{if(c!==col)c.classList.remove('over')}); col.classList.add('over'); } });
document.addEventListener('drop',e=>{ const col=e.target.closest&&e.target.closest('.col'); if(col&&dragId){ e.preventDefault(); const id=dragId; dragId=null; moveLead(id,+col.dataset.stage); } });
let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ const v=V[S.view]; v.after&&v.after(); },120); });
window.addEventListener('hashchange',()=>go((location.hash||'').slice(1)));

function syncCur(){ $$('#cur button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cur===S.cur))); }
(function init(){
  try{ const th=localStorage.getItem('nuvia-theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
  $('#today').textContent = DIAS[NOW.getDay()].replace(/^./,c=>c.toUpperCase())+', '+NOW.getDate()+' de '+MESL[NOW.getMonth()]+' de '+NOW.getFullYear();
  syncCur(); badge();
  const h=(location.hash||'').slice(1); go(V[h]?h:'resumen',true);
})();
</script>
</body></html>

<meta name="claude:viewport-fit-sides" content="cover">
<title>Nuvia Inmobiliaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif&display=swap">
<style>
/* Layout: sidebar oscuro fijo + área de trabajo clara. Tokens: tinta azul, verde petróleo, oro. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#f6f8fb; --line:#e2e8f0; --line-2:#cfd8e3;
  --fg:#0e1a2b; --fg-2:#56677f; --fg-3:#8593a8;
  --accent:#0a7570; --accent-2:#0e8f89; --accent-soft:#dff2f0; --on-accent:#ffffff;
  --gold:#b98a2c; --good:#17885a; --warn:#c07a0c; --bad:#c4433c; --info:#2f6bc4;
  --side:#0b1625; --side-2:#13233a; --side-fg:#b9c6d9; --side-fg-hi:#ffffff;
  --tip:#0e1a2b; --tip-fg:#f4f7fb; --shadow:0 1px 2px rgba(14,26,43,.05),0 8px 24px -12px rgba(14,26,43,.12);
  --s-disp:#0a7570; --s-res:#c89a35; --s-sold:#3f5778; --s-block:#a3afc0;
  --ser0:#0a7570; --ser1:#c89a35; --ser2:#3f5778; --ser3:#b5483f; --ser4:#6b9e8f; --ser5:#8a5a83; --ser6:#7d8da3; --ser7:#a8742a;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111d; --surface:#0f1b2c; --surface-2:#142238; --line:#1f3049; --line-2:#2b4062;
  --fg:#e8eef7; --fg-2:#9aaec8; --fg-3:#6b7f9b;
  --accent:#34c0b8; --accent-2:#5fd3cc; --accent-soft:#0f3a3b; --on-accent:#06201f;
  --gold:#e2b552; --good:#3ccf90; --warn:#e5a23a; --bad:#f06c64; --info:#6aa0f0;
  --side:#060d17; --side-2:#0f1b2c; --side-fg:#9fb1ca; --side-fg-hi:#ffffff;
  --tip:#e8eef7; --tip-fg:#0e1a2b; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --s-disp:#34c0b8; --s-res:#e2b552; --s-sold:#6f8bb3; --s-block:#4a5c78; --ser0:#34c0b8; --ser1:#e2b552; --ser2:#6f8bb3; --ser3:#f06c64; --ser4:#7fd0b8; --ser5:#c08ad0; --ser6:#9fb1ca; --ser7:#d9a35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111d; --surface:#0f1b2c; --surface-2:#142238; --line:#1f3049; --line-2:#2b4062;
  --fg:#e8eef7; --fg-2:#9aaec8; --fg-3:#6b7f9b;
  --accent:#34c0b8; --accent-2:#5fd3cc; --accent-soft:#0f3a3b; --on-accent:#06201f;
  --gold:#e2b552; --good:#3ccf90; --warn:#e5a23a; --bad:#f06c64; --info:#6aa0f0;
  --side:#060d17; --side-2:#0f1b2c; --side-fg:#9fb1ca; --side-fg-hi:#ffffff;
  --tip:#e8eef7; --tip-fg:#0e1a2b; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --s-disp:#34c0b8; --s-res:#e2b552; --s-sold:#6f8bb3; --s-block:#4a5c78; --ser0:#34c0b8; --ser1:#e2b552; --ser2:#6f8bb3; --ser3:#f06c64; --ser4:#7fd0b8; --ser5:#c08ad0; --ser6:#9fb1ca; --ser7:#d9a35a; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--side);color:var(--side-fg);padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--accent-2),var(--accent));display:grid;place-items:center;flex:none}
.brand b{display:block;color:var(--side-fg-hi);font-size:16px;letter-spacing:.01em;line-height:1.1}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-fg);opacity:.75}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:14px 10px 6px;opacity:.55}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:var(--side-fg);text-decoration:none;font-weight:600;font-size:13.5px;position:relative}
.nav a:hover{background:var(--side-2);color:var(--side-fg-hi)}
.nav a[aria-current="page"]{background:var(--side-2);color:var(--side-fg-hi);box-shadow:inset 3px 0 0 var(--accent-2)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:var(--gold);color:#1b1405;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--side-2)}
.me b{display:block;color:var(--side-fg-hi);font-size:13px}
.me span{font-size:11.5px;opacity:.75}
.demo{font-size:11px;opacity:.55;padding:0 8px}

.main{min-width:0;padding-block:26px 56px;padding-left:max(clamp(16px,2.6vw,36px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.6vw,36px),env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);font-weight:600;display:flex;align-items:center;gap:8px}
.live{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
h1.title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,42px);line-height:1.05;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.head-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.iconbtn{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg-2)}
.iconbtn:hover{border-color:var(--line-2);color:var(--fg)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.sm button{padding:4px 10px;font-size:12px}

.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tb .grow{flex:1 1 auto}
.field{position:relative;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:0 12px;height:38px;min-width:0}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.field>span{color:var(--fg-3);font-size:12px;white-space:nowrap}
.field select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:600;font-size:13px;height:100%;padding-right:18px;outline:none;min-width:0;max-width:200px;text-overflow:ellipsis;cursor:pointer}
.field select option{background:var(--surface);color:var(--fg)}
.field.sl::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--fg-3);border-bottom:1.6px solid var(--fg-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.field input[type=search],.field input[type=text]{border:0;background:transparent;outline:none;height:100%;min-width:150px;width:100%;font-size:13px}
.field.search{flex:1 1 220px;max-width:340px}
.field svg{width:16px;height:16px;stroke:var(--fg-3);fill:none;stroke-width:1.8;flex:none}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1280px){.c3{grid-column:span 4}.c4{grid-column:span 6}.c5{grid-column:span 6}.c7{grid-column:span 12}.c8{grid-column:span 12}}
@media(max-width:820px){.c3,.c4,.c5,.c6{grid-column:span 12}}
@media(max-width:1280px) and (min-width:821px){.kpis .c3{grid-column:span 4}}
@media(max-width:1560px){.kpis .c2{grid-column:span 4}}
@media(max-width:820px){.kpis .c2{grid-column:span 6}}
@media(max-width:480px){.kpis .c2{grid-column:span 12}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.005em}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--fg-3)}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:700}

.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--fg-3);margin-left:3px}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kpi svg.spark{width:72px;height:30px;flex:none}
.kpi .sub{font-size:12px;color:var(--fg-3)}
.kpi.hero{background:linear-gradient(160deg,var(--side) 0%,#10304a 100%);border-color:transparent;color:#eaf1fa}
.kpi.hero .lbl,.kpi.hero .sub{color:#9fb6d2}
.kpi.hero .v small{color:#9fb6d2}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.delta.dn{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.kpi.hero .delta.up{color:#6fe3b0;background:rgba(111,227,176,.14)}
.kpi.hero .delta.dn{color:#ff9d96;background:rgba(255,157,150,.14)}

.pill{--c:var(--fg-2);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.p-disp{--c:var(--s-disp)}.p-res{--c:var(--warn)}.p-sold{--c:var(--s-sold)}.p-block{--c:var(--fg-3)}
.t-hot{--c:var(--bad)}.t-warm{--c:var(--warn)}.t-cold{--c:var(--info)}
.p-good{--c:var(--good)}.p-bad{--c:var(--bad)}.p-gold{--c:var(--gold)}.p-acc{--c:var(--accent)}

.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;flex:none;letter-spacing:.02em}
.av.lg{width:52px;height:52px;font-size:17px}.av.sm{width:24px;height:24px;font-size:10px}

.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th.r,td.r{text-align:right}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--fg)}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:9px}
.who b{display:block;font-weight:600;line-height:1.2}
.who small{color:var(--fg-3);font-size:12px}
.muted{color:var(--fg-3)}

.hb{display:flex;flex-direction:column;gap:11px}
.hb-r{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;align-items:center;gap:12px;font-size:12.5px}
.hb-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2);font-weight:600}
.hb-t{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hb-t i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hb-r .vv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fun{display:flex;flex-direction:column;gap:7px}
.fun-r{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center;font-size:12.5px}
.fun-r .n{color:var(--fg-2);font-weight:600}
.fun-b{height:34px;border-radius:8px;background:var(--surface-2);position:relative;overflow:hidden}
.fun-b i{position:absolute;inset:0 auto 0 0;border-radius:8px;border-left:4px solid var(--accent)}
.fun-b span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.fun-b span em{font-style:normal;font-weight:600;font-size:11.5px;color:var(--fg-2)}
@media(max-width:520px){.fun-r{grid-template-columns:92px minmax(0,1fr)}}

.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--fg-3);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent);transition:opacity .15s}
.chart .bar.dim{fill:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.chart .hit:hover+.bar,.chart .barg:hover .bar{opacity:.78}
.chart .goal{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:5 4}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.donut-w{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut-w svg{flex:none}
.dl{display:flex;flex-direction:column;gap:7px;flex:1 1 170px;min-width:0}
.dl div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.dl i{width:10px;height:10px;border-radius:3px}
.dl b{font-variant-numeric:tabular-nums}

.alerts{display:flex;flex-direction:column;gap:10px}
.al{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left;width:100%}
.al:hover{border-color:var(--line-2)}
.al .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.al .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.al b{display:block;font-size:13px}.al small{color:var(--fg-3);font-size:12px}
.al .k{margin-left:auto;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.pc{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s;text-align:left}
.pc:hover{transform:translateY(-2px);border-color:var(--line-2)}
.pc-top{height:116px;position:relative;background:linear-gradient(180deg,var(--hue-a),var(--hue-b));overflow:hidden}
.pc-top svg{position:absolute;inset:auto 0 0 0;width:100%;height:84px}
.pc-top .pill{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.88);color:#10243a}
.pc-top .pill i{background:#10243a}
.pc-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.pc-b h4{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.pc-b .loc{color:var(--fg-3);font-size:12.5px}
.stk{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.stk i{display:block;height:100%}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stats3 small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.stats3 b{font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--fg-3)}
.prog>div:first-child{display:flex;justify-content:space-between}
.prog .hb-t{height:6px}

.plan{display:flex;flex-direction:column;gap:4px}
.plan-r{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center}
.plan-r small{color:var(--fg-3);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.plan-c{display:grid;gap:4px}
.cell{height:32px;border-radius:7px;border:0;font-size:11px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;padding:0}
.cell.disp{background:var(--s-disp)}.cell.res{background:var(--s-res);color:#2a1d03}.cell.sold{background:var(--s-sold)}.cell.block{background:var(--s-block)}
.cell:hover{filter:brightness(1.12);transform:scale(1.04)}

.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--fg-3);flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--line-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.4;cursor:default}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:150px;flex:1 1 150px}
.chip b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip small{color:var(--fg-3);font-size:12px}

.lead-t{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.task{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.task:hover{border-color:var(--line-2)}
.task .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c,var(--accent));flex:none}
.task b{display:block;font-size:12.5px}.task small{color:var(--fg-3);font-size:11.5px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:260px}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
